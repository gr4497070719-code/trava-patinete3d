<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trava de Patinete 3D - Printec</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #090d16; color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif; overflow: hidden;
    }
    model-viewer { width: 100%; height: 100vh; --poster-color: transparent; }
  </style>
</head>
<body class="relative">
  <model-viewer 
    src="trava-patinete.glb" 
    alt="Trava de Patinete 3D" 
    auto-rotate 
    rotation-per-second="20deg" 
    camera-controls 
    interaction-prompt="none"
    shadow-intensity="1.5"
    exposure="1.2"
    ar>
    <div class="absolute top-6 left-6 max-w-sm bg-slate-900/85 backdrop-blur-md p-5 rounded-2xl border border-slate-800 shadow-2xl pointer-events-none">
      <span class="px-2 py-1 rounded bg-cyan-950 border border-cyan-500/30 text-cyan-400 text-xs font-bold uppercase tracking-wider">Peça Técnica em 3D</span>
      <h1 class="text-xl font-black mt-2 text-white">Trava de Segurança para Patinete</h1>
      <p class="text-xs text-slate-300 mt-1 leading-relaxed">Substituição sob medida com alta resistência mecânica.</p>
    </div>
  </model-viewer>
</body>
</html>
