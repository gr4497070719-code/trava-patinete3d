<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printec 3D</title>
    
    <!-- COLA O CÓDIGO AQUI DENTRO -->
    <style>
        .printec-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }
        .printec-text-card {
            flex: 1;
            background: rgba(18, 24, 38, 0.9);
            border: 1px solid rgba(0, 243, 255, 0.25);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .printec-3d-box {
            flex: 1;
            width: 100%;
            height: 500px;
            background: #05070b;
            border: 1px solid rgba(0, 243, 255, 0.25);
            border-radius: 16px;
            overflow: hidden;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }
        @media (max-width: 768px) {
            .printec-container {
                flex-direction: column;
                gap: 20px;
                padding: 10px;
            }
            .printec-text-card {
                width: 100%;
                padding: 20px;
                text-align: center;
            }
            .printec-3d-box {
                width: 100%;
                height: 350px;
            }
            .printec-text-card h2 {
                font-size: 1.5rem;
            }
            .printec-text-card p {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
