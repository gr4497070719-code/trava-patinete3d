<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trava de Segurança 3D - Printec</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonte Inter & Orbitron para tipografia premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 70% 50%, #2b2215 0%, #12100d 50%, #080706 100%);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
        }
        .font-impact {
            font-family: 'Orbitron', sans-serif;
        }
        model-viewer {
            width: 100%;
            height: 100vh;
            --poster-color: transparent;
        }
        /* Gradiente dourado no texto */
        .text-gold-gradient {
            background: linear-gradient(180deg, #ffffff 0%, #dfb25d 60%, #a87e2a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Efeito de brilho no botão */
        .btn-gold {
            background: linear-gradient(135deg, #e5b851 0%, #a67b22 100%);
            box-shadow: 0 10px 25px -5px rgba(229, 184, 81, 0.3);
            transition: all 0.3s ease;
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(229, 184, 81, 0.5);
        }
    </style>
</head>
<body class="relative flex items-center justify-between">

    <!-- Conteúdo em Texto na Esquerda -->
    <div class="z-10 w-full max-w-xl pl-8 md:pl-16 lg:pl-24 pr-6 pointer-events-none">
        
        <!-- Badge de Disponibilidade -->
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-yellow-950/40 border border-yellow-600/30 text-yellow-500 text-xs font-bold tracking-widest uppercase mb-6 backdrop-blur-md">
            <span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span>
            SUBSTITUIÇÃO DE ALTA PRECISÃO
        </div>

        <!-- Título Principal em Caixa Alta -->
        <h1 class="font-impact text-4xl sm:text-5xl lg:text-6xl font-black uppercase tracking-tight leading-none mb-4">
            GARANTA A SUA <br>
            <span class="text-gold-gradient">SEGURANÇA</span>
        </h1>

        <!-- Descrição Estilizada -->
        <p class="text-neutral-400 text-sm sm:text-base leading-relaxed mb-8 max-w-md font-medium">
            Engenharia reversa sob medida para o seu patinete. Peça produzida em impressão 3D de alta densidade mecânica para máxima resistência ao impacto.
        </p>

        <!-- Botão de Ação CTA -->
        <div class="pointer-events-auto">
            <a href="#comprar" class="btn-gold inline-flex items-center justify-center gap-3 px-8 py-4 rounded-xl
