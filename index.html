<!DOCTYPE html>
<html lang="pt-PT" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trava de Segurança 3D - Printec High-Tech</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ícones para o cabeçalho (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle at 30% 50%, #1a2236 0%, #0d111c 50%, #040508 100%);
            color: #ffffff;
            font-family: 'Exo 2', sans-serif;
            overflow-x: hidden;
        }

        /* ESTILOS DO CABEÇALHO 3D (AZUL E BRANCO) */
        .cabecalho-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(0, 150, 255, 0.3);
            z-index: 1000; /* Mantém o cabeçalho sempre por cima de tudo */
        }

        .logo-header {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-header i {
            color: #00bfff;
            font-size: 1.8rem;
        }

        .logo-header h1 {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 0;
        }

        .logo-header h1 span {
            color: #00bfff;
        }

        .menu-nav {
            display: flex;
            gap: 30px;
        }

        .menu-nav a {
            color: #e0e6ed;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .menu-nav a i {
            color: #00bfff;
            font-size: 0.9rem;
            transition: transform 0.3s ease;
        }

        .menu-nav a:hover {
            color: #00bfff;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
        }

        .menu-nav a:hover i {
            transform: translateY(-2px);
        }

        /* Visualizador 3D Fixo no PC (Deslocado 75px para baixo para não ficar sob o cabeçalho) */
        model-viewer {
            position: fixed;
            top: 75px;
            right: 0;
            width: 50vw;
            height: calc(100vh - 75px);
            --poster-color: transparent;
            z-index: 10;
            pointer-events: auto;
            transition: camera-orbit 0.8s cubic-bezier(0.25, 1, 0.5, 1), field-of-view 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Painéis HUD */
        .hud-panel {
            background-color: rgba(6, 9, 17, 0.92);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(110, 231, 245, 0.4);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.95);
        }
        .text-cyan-gradient {
            background: linear-gradient(180deg, #ffffff 0%, #6ee7f5 70%, #22d3ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-neon-cyan {
            background: linear-gradient(135deg, #22d3ee 0%, #0891b2 100%);
            color: #040508;
            box-shadow: 0 8px 30px 2px rgba(34, 211, 238, 0.5);
            transition: all 0.3s ease;
        }
        .btn-neon-cyan:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 12px 40px 5px rgba(34, 211, 238, 0.7);
        }
        .badge-glow {
            box-shadow: 0 0 12px 2px rgba(34, 211, 238, 0.3);
        }
        
        /* Roleta de Textos com espaçamento topo */
        .scroll-section {
            height: 100vh;
            display: flex;
            align-items: center;
            padding-left: 5vw;
            padding-top: 75px;
            position: relative;
            z-index: 20;
            will-change: transform, opacity, filter;
        }

        /* CARD GALERIA COM ANIMAÇÃO CYBER */
        .gallery-card {
            position: relative;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(34, 211, 238, 0.2);
            background: rgba(13, 17, 28, 0.8);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .gallery-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(34, 211, 238, 0.8);
            box-shadow: 0 15px 35px -10px rgba(34, 211, 238, 0.4);
        }
        .gallery-card img {
            transition: transform 0.6s ease;
        }
        .gallery-card:hover img {
            transform: scale(1.1);
        }
        .gallery-overlay {
            background: linear-gradient(0deg, rgba(6, 9, 17, 0.95) 0%, rgba(6, 9, 17, 0.2) 60%, transparent 100%);
            opacity: 0.9;
            transition: opacity 0.3s ease;
        }

        /* Ajustes Mobile */
        @media (max-width: 768px) {
            .cabecalho-3d {
                padding: 0 20px;
                height: 65px;
            }
            .menu-nav {
                display: none; /* Oculta menu horizontal em telas menores para otimizar espaço */
            }
            model-viewer {
                width: 100vw;
                height: 40vh;
                top: 65px;
                right: 0;
                left: 0;
            }
            .scroll-section {
                padding-left: 1rem;
                padding-right: 1rem;
                justify-content: center;
                padding-top: 38vh;
            }
            .hud-panel {
                padding: 1.5rem !important;
                border-radius: 1.25rem !important;
            }
            h1, h2 {
                font-size: 1.8rem !important;
            }
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO PERSONALIZADO 3D (AZUL E BRANCO) -->
    <header class="cabecalho-3d">
        <a href="#inicio" class="logo-header">
            <i class="fa-solid fa-cube"></i>
            <h1>PRINTEC<span>3D</span></h1>
        </a>
        <nav class="menu-nav">
            <a href="#inicio"><i class="fa-solid fa-house"></i> Início</a>
            <a href="#modelos"><i class="fa-solid fa-layer-group"></i> Modelos</a>
            <a href="#galeria"><i class="fa-solid fa-images"></i> Galeria</a>
            <a href="#contato"><i class="fa-solid fa-envelope"></i> Contato</a>
        </nav>
    </header>

    <!-- VISUALIZADOR 3D FIXO -->
    <model-viewer
        id="trava-viewer"
        src="trava-patinete3d.glb"
        alt="Trava de Patinete 3D High-Tech"
        camera-target="0m 0.05m 0.03m"
        camera-orbit="45deg 75deg 105%"
        field-of-view="32deg"
        camera-controls
        interaction-prompt="none"
        shadow-intensity="2.2"
        shadow-softness="1"
        exposure="0.75"
        environment-image="neutral"
        ar>
    </model-viewer>

    <!-- CONTEÚDO DE ROLAGEM / ROLETA DE TEXTOS -->
    <div class="relative w-full" id="inicio">

        <!-- SECÇÃO 1: VISÃO GERAL -->
        <section class="scroll-section" data-orbit="45deg 75deg 105%" data-fov="32deg" data-time="0">
            <div class="w-full max-w-xl hud-panel p-10 rounded-3xl">
                <div class="flex items-center gap-3 mb-5">
                    <span class="badge-glow px-4 py-1.5 rounded-full bg-cyan-950 text-cyan-400 text-xs font-bold tracking-widest uppercase border border-cyan-500/40">PASSO 01</span>
                    <span class="badge-glow px-4 py-1.5 rounded-full bg-emerald-950 text-emerald-400 text-xs font-bold tracking-widest uppercase border border-emerald-500/40">PRINTEC 3D</span>
                </div>
                <h1 class="font-extrabold text-4xl sm:text-5xl uppercase tracking-tighter leading-none mb-4">
                    DESIGN SOB <br>
                    <span class="text-cyan-gradient">MEDIDA</span>
                </h1>
                <p class="text-neutral-300 text-base sm:text-lg leading-relaxed mb-8">
                    Desenvolvido por engenharia reversa diretamente sobre a peça original danificada, garantindo tolerâncias milimétricas de encaixe perfeito para o teu patinete.
                </p>
                <div class="flex items-center gap-2 text-cyan-400 text-xs font-bold tracking-wider uppercase animate-bounce">
                    <span>↓ Rola para girar a roleta técnica</span>
                </div>
            </div>
        </section>

        <!--
